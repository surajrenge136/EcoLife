<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EcoLife - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            🌱 EcoLife
        </div>


        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/products">
                Products
            </a>

            <a href="/cart">
                🛒 Cart
            </a>

            <a href="/my-orders">
                📦 My Orders
            </a>

            <a href="#">
                About
            </a>

            <a href="/login">
                🔐 Login
            </a>

        </div>

    </nav>



    <!-- Register Section -->

    <section class="auth-section">

        <div class="auth-card">


            <div class="auth-icon">
                🌱
            </div>


            <h1>
                Create Account
            </h1>


            <p class="auth-subtitle">
                Join EcoLife and start your sustainable journey.
            </p>


            {% if error %}

            <div class="auth-error">
                {{ error }}
            </div>

            {% endif %}


            <form action="/register"
                  method="POST">


                <!-- Name -->

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Email -->

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <!-- Confirm Password -->

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >


                <!-- Register Button -->

                <button
                    type="submit"
                    class="auth-btn"
                >

                    🌱 Create Account

                </button>


            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="/login">
                    Login Here
                </a>

            </p>


        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 EcoLife. Live Green. Live Better.
        </p>

    </footer>


</body>

</html>
